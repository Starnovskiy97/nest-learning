name: nest-learning

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: nest
      POSTGRES_PASSWORD: nest_dev_password
      POSTGRES_DB: nest_learning
    ports:
      - '127.0.0.1:5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U nest -d nest_learning']
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  postgres_data:
