name: nest-learning

services:
  redis:
    image: redis:8.2-alpine
    profiles: ['cache']
    command:
      [
        'redis-server',
        '--maxmemory',
        '64mb',
        '--maxmemory-policy',
        'allkeys-lru',
        '--save',
        '',
        '--appendonly',
        'no',
      ]
    ports:
      - '127.0.0.1:6380:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 3s
      retries: 10

  nginx:
    image: nginx:1.28-alpine
    profiles: ['proxy']
    environment:
      API_UPSTREAM: host.docker.internal:3000
      API_EXTRA_SERVER: ''
      NGINX_ENVSUBST_FILTER: '^API_(UPSTREAM|EXTRA_SERVER)$$'
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    ports:
      - '127.0.0.1:8080:80'
    volumes:
      - ./infra/nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: nest
      POSTGRES_PASSWORD: nest_dev_password
      POSTGRES_DB: nest_learning
    ports:
      - '127.0.0.1:5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U nest -d nest_learning']
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  postgres_data:
